name: M7 simulator qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-m7:
    name: Compare and select the M7 candidate
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      EVIDENCE_DIRECTORY: /tmp/mirmir-m7-simulation-evidence
    steps:
      - name: Check out exact source with frozen P05 history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen simulator toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$'Xcode 26.2\nBuild version 17C52'
          test -x "${DEVELOPER_DIR}/usr/bin/xcodebuild"
          test "$(xcodebuild -version)" = "${expected_version}"

      - name: Install locked Python metric runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install simulator-metric dependency
        run: python3 -m pip install 'numpy==2.0.2'

      - name: Run and independently replay M7 simulator selection
        run: |
          script/v4/run_m7_simulation_v4.sh \
            --output "${EVIDENCE_DIRECTORY}"

      - name: Upload sealed M7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-simulation-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIRECTORY }}
          if-no-files-found: warn
          retention-days: 14
