name: Update pull request version

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: write

concurrency:
  group: pull-request-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-version:
    name: Apply version label
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve version label
        id: label
        shell: bash
        run: |
          set -euo pipefail
          labels=()
          while IFS= read -r label; do
            case "$label" in
              release|feature-release|patch/hotfix)
                labels+=("$label")
                ;;
            esac
          done < <(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")

          if (( ${#labels[@]} > 1 )); then
            printf 'Conflicting version labels: %s\n' "${labels[*]}" >&2
            exit 1
          fi

          if (( ${#labels[@]} == 0 )); then
            bump='none'
          else
            bump="${labels[0]}"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Selected increment: $bump"

      - name: Calculate and apply version
        id: version
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BUMP: ${{ steps.label.outputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git cat-file -e "origin/$BASE_REF:VERSION" 2>/dev/null; then
            base_version="$(git show "origin/$BASE_REF:VERSION" | tr -d '\r\n')"
          else
            mapfile -t project_versions < <(
              git show "origin/$BASE_REF:Mirmir.xcodeproj/project.pbxproj" \
                | sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([0-9]+\.[0-9]+\.[0-9]+);[[:space:]]*$/\1/p' \
                | sort -u
            )
            if (( ${#project_versions[@]} != 1 )); then
              echo 'Base branch has no VERSION and no single Xcode marketing version.' >&2
              exit 1
            fi
            base_version="${project_versions[0]}"
            echo "Bootstrapping from Xcode marketing version: $base_version"
          fi
          target_version="$(python3 script/update_version.py \
            --base-version "$base_version" \
            --bump "$BUMP")"
          echo "target=$target_version" >> "$GITHUB_OUTPUT"
          echo "Base version: $base_version"
          echo "Target version: $target_version"

      - name: Validate synchronized version
        run: python3 script/update_version.py --check

      - name: Commit version update
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TARGET_VERSION: ${{ steps.version.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION Mirmir.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo "Version already matches $TARGET_VERSION; no commit needed."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update version to $TARGET_VERSION"
          git push origin "HEAD:$HEAD_REF"
