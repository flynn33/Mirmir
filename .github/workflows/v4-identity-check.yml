name: Verify deterministic v4 identities

on:
  workflow_dispatch:

concurrency:
  group: v4-identities-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-v4-identities:
    name: Replay corpus, runtime, and evidence identities
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install locked Python test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install corpus-test dependency
        run: python3 -m pip install 'numpy==2.0.2'

      - name: Test identity contracts
        run: |
          python3 script/v4/test_p06_source_identity_v4.py
          python3 script/v4/test_natural_quality_corpus.py
          python3 script/v4/test_repository_identity_v4.py

      - name: Test every release-qualification lane
        run: |
          python3 script/v4/test_quality_gate_v4.py
          python3 script/v4/test_performance_gate_v4.py
          python3 script/v4/test_cpu_metal_parity_v4.py
          python3 script/v4/test_media_preservation_v4.py
          python3 script/v4/test_recovery_qualification_v4.py
          python3 script/v4/test_p06_reproduction_v4.py
          python3 script/v4/test_capture_p06_reproduction_v4.py
          python3 script/v4/test_support_matrix_v4.py
          python3 script/v4/test_capture_support_matrix_v4.py
          python3 script/v4/test_notarized_smoke_v4.py
          python3 script/v4/test_p05_baseline_v4.py
          python3 script/v4/test_packaged_candidate_evidence_v4.py
          python3 script/v4/test_prepare_release_candidate_v4.py
          python3 script/v4/test_assemble_release_evidence_index_v4.py
          python3 script/v4/test_release_runner_source_identity_v4.py
          python3 script/v4/test_release_qualification_v4.py

      - name: Verify checked-in identities
        run: python3 script/v4/repository_identity_v4.py --repository "$PWD"

      - name: Reproduce the release trust root
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d "${RUNNER_TEMP}/mirmir-v4-trust.XXXXXX")"
          generated_trust_root="${temporary_directory}/release-qualification-trust-root-v1.json"
          python3 script/v4/release_qualification_trust_v4.py \
            --contract script/v4/release-qualification-contract-v1.json \
            --output "${generated_trust_root}"
          cmp \
            script/v4/release-qualification-trust-root-v1.json \
            "${generated_trust_root}"

      - name: Reproduce and load a P06 runtime for this toolchain
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d "${RUNNER_TEMP}/mirmir-v4-p06.XXXXXX")"
          artifacts="${temporary_directory}/artifacts"
          runtime="${temporary_directory}/runtime"
          provenance="${temporary_directory}/provenance"
          script/v4/build_p06_release_runtime.sh \
            --artifacts "${artifacts}" \
            --output "${runtime}" \
            --provenance "${provenance}"
          reproduced_source_revision="$(
            python3 script/v4/p06_source_identity_v4.py verify-manifest \
              --repository "$PWD" \
              --contract script/v4/p06-source-provenance-v1.json \
              --manifest "${provenance}/production-source-manifest.json"
          )"
          declared_source_revision="$(python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["provenance"]["sourceRevision"])
          ' "${runtime}/runtime-manifest.json")"
          test "${reproduced_source_revision}" = "${declared_source_revision}"
          manifest_sha256="$(python3 -c '
          import hashlib, sys
          data = open(sys.argv[1], "rb").read()
          print(hashlib.sha256(b"ash-p06-runtime-manifest-v4\0" + data).hexdigest())
          ' "${runtime}/runtime-manifest.json")"
          builder_sha256="$(python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["provenance"]["builderSourceSHA256"])
          ' "${runtime}/runtime-manifest.json")"
          script/v4/run_p06_runtime_load_check.sh \
            "${runtime}" \
            "${manifest_sha256}" \
            "${reproduced_source_revision}" \
            "${builder_sha256}"

      - name: Load the production P06 bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="Mirmir/Resources/ASH-P06.bundle"
          manifest="$bundle/runtime-manifest.json"
          manifest_sha256="$(python3 -c '
          import hashlib, sys
          data = open(sys.argv[1], "rb").read()
          print(hashlib.sha256(b"ash-p06-runtime-manifest-v4\0" + data).hexdigest())
          ' "$manifest")"
          source_revision="$(python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["provenance"]["sourceRevision"])
          ' "$manifest")"
          builder_sha256="$(python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["provenance"]["builderSourceSHA256"])
          ' "$manifest")"
          script/v4/run_p06_runtime_load_check.sh \
            "$bundle" \
            "$manifest_sha256" \
            "$source_revision" \
            "$builder_sha256"

      - name: Replay the ASH algebra certificate
        run: script/v4/run_ash_v4_semantic_selftest.sh
