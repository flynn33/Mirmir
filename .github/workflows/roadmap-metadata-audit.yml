name: Roadmap metadata audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: roadmap-metadata-audit
  cancel-in-progress: true

jobs:
  roadmap-metadata-audit:
    name: Roadmap metadata audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify live GitHub repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Scripts/roadmap_alignment.py --check-github-metadata --metadata-attempts 3
