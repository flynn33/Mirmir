name: Roadmap alignment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-alignment-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  roadmap-alignment:
    name: Roadmap alignment
    needs: [r02-functional-acceptance, r04-functional-acceptance, r05-functional-acceptance, r06-functional-acceptance, r10-functional-acceptance, r11-functional-acceptance, r12-functional-acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require passing functional acceptances
        run: |
          test "${{ needs.r02-functional-acceptance.result }}" = "success"
          test "${{ needs.r04-functional-acceptance.result }}" = "success"
          test "${{ needs.r05-functional-acceptance.result }}" = "success"
          test "${{ needs.r06-functional-acceptance.result }}" = "success"
          test "${{ needs.r10-functional-acceptance.result }}" = "success"
          test "${{ needs.r11-functional-acceptance.result }}" = "success"
          test "${{ needs.r12-functional-acceptance.result }}" = "success"

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test roadmap, inventory, and evidence verifiers
        run: >-
          python3 -m unittest
          Scripts/tests/test_roadmap_alignment.py
          Scripts/tests/test_r00_inventory.py
          Scripts/tests/test_json_schema_validator.py
          Scripts/tests/test_phase_evidence.py
          Scripts/tests/test_r01_preregistration.py
          Scripts/tests/test_r01_capabilities.py
          Scripts/tests/test_r01_observation_waiver.py
          Scripts/tests/test_r02_contracts.py
          Scripts/tests/test_r02_phase_acceptance.py
          Scripts/tests/test_r03_contracts.py
          Scripts/tests/test_r03_product_qualification.py
          Scripts/tests/test_r03_phase_acceptance.py
          Scripts/tests/test_r04_contracts.py
          Scripts/tests/test_r04_phase_acceptance.py
          Scripts/tests/test_r05_contracts.py
          Scripts/tests/test_r05_phase_acceptance.py
          Scripts/tests/test_r06_contracts.py
          Scripts/tests/test_r06_phase_acceptance.py
          Scripts/tests/test_r07_contracts.py
          Scripts/tests/test_r07_phase_acceptance.py
          Scripts/tests/test_r08_contracts.py
          Scripts/tests/test_r08_phase_acceptance.py
          Scripts/tests/test_r09_contracts.py
          Scripts/tests/test_r09_phase_acceptance.py
          validation/calibration_v2/tests/test_r10_optimizer.py
          validation/calibration_v2/tests/test_r10_persistence.py
          validation/calibration_v2/tests/test_run_r10_fixture_calibration.py
          Scripts/tests/test_r10_contracts.py
          Scripts/tests/test_r10_phase_acceptance.py
          validation/calibration_v2/tests/test_r11_traceability.py
          validation/calibration_v2/tests/test_run_r11_fixture_traceability.py
          Scripts/tests/test_r11_contracts.py
          Scripts/tests/test_r11_phase_acceptance.py
          Scripts/tests/test_r12_phase_acceptance.py

      - name: Verify roadmap alignment
        run: python3 Scripts/roadmap_alignment.py --check

      - name: Verify R00 source inventory
        run: python3 Scripts/r00_inventory.py --check

      - name: Verify R01 preregistration
        run: python3 Scripts/r01_preregistration.py --check

      - name: Verify R01 deterministic fixtures
        run: python3 Scripts/r01_preregistration.py --check-fixtures

      - name: Verify R02 preregistration
        run: python3 Scripts/r02_contracts.py --check-preregistration

      - name: Verify R02 deterministic fixtures
        run: python3 Scripts/r02_contracts.py --check-fixtures

      - name: Verify R02 conformance when present
        shell: bash
        run: |
          if [[ -f docs/roadmaps/evidence/r02/records/conformance.json ]]; then
            python3 Scripts/r02_contracts.py --check-conformance
          fi

      - name: Verify R02 functional phase acceptance
        run: python3 Scripts/r02_phase_acceptance.py --check

      - name: Verify R03 preregistration
        run: python3 Scripts/r03_contracts.py --check-preregistration

      - name: Verify R03 deterministic fixtures
        run: python3 Scripts/r03_contracts.py --check-fixtures

      - name: Verify R03 conformance when present
        shell: bash
        run: |
          if [[ -f docs/roadmaps/evidence/r03/records/baseline-conformance.json ]]; then
            python3 Scripts/r03_contracts.py --check-conformance
          fi

      - name: Verify R03 v2 product-qualification preregistration
        run: python3 Scripts/r03_product_qualification.py --check-preregistration

      - name: Verify R03 v2 product-qualification fixtures
        run: python3 Scripts/r03_product_qualification.py --check-fixtures

      - name: Verify R03 v2 product-qualification receipt
        run: python3 Scripts/r03_product_qualification.py --check-receipt

      - name: Verify R03 v2 product-qualification decision
        run: python3 Scripts/r03_product_qualification.py --check-decision

      - name: Verify R03 functional phase acceptance
        run: python3 Scripts/r03_phase_acceptance.py --check

      - name: Verify R04 preregistration
        run: python3 Scripts/r04_contracts.py --check-preregistration

      - name: Verify R04 deterministic fixtures
        run: python3 Scripts/r04_contracts.py --check-fixtures

      - name: Verify R04 conformance when present
        shell: bash
        run: |
          if [[ -f docs/roadmaps/evidence/r04/records/integration-conformance.json ]]; then
            python3 Scripts/r04_contracts.py --check-conformance
          fi

      - name: Verify R04 functional phase acceptance
        run: python3 Scripts/r04_phase_acceptance.py --check

      - name: Verify R05 preregistration
        run: python3 Scripts/r05_contracts.py --check-preregistration

      - name: Verify R05 deterministic fixtures
        run: python3 Scripts/r05_contracts.py --check-fixtures

      - name: Verify R05 conformance when present
        shell: bash
        run: |
          if [[ -f docs/roadmaps/evidence/r05/records/suitability-conformance.json ]]; then
            python3 Scripts/r05_contracts.py --check-conformance
          fi

      - name: Verify R05 functional phase acceptance
        run: python3 Scripts/r05_phase_acceptance.py --check

      - name: Verify R06 preregistration
        run: python3 Scripts/r06_contracts.py --check-preregistration

      - name: Verify R06 deterministic fixtures
        run: python3 Scripts/r06_contracts.py --check-fixtures

      - name: Verify R06 conformance when present
        shell: bash
        run: |
          if [[ -f docs/roadmaps/evidence/r06/records/orchestration-conformance.json ]]; then
            python3 Scripts/r06_contracts.py --check-conformance
          fi

      - name: Verify R06 functional phase acceptance
        run: python3 Scripts/r06_phase_acceptance.py --check

      - name: Verify R07 preregistration
        run: python3 Scripts/r07_contracts.py --check-preregistration

      - name: Verify R07 deterministic fixtures
        run: python3 Scripts/r07_contracts.py --check-fixtures

      - name: Verify R07 conformance when present
        shell: bash
        run: |
          if [[ -f docs/roadmaps/evidence/r07/records/temporal-artifact-conformance.json ]]; then
            python3 Scripts/r07_contracts.py --check-conformance
          fi

      - name: Verify R07 functional phase acceptance
        run: python3 Scripts/r07_phase_acceptance.py --check

      - name: Verify R08 preregistration
        run: python3 Scripts/r08_contracts.py --check-preregistration

      - name: Verify R08 deterministic fixtures
        run: python3 Scripts/r08_contracts.py --check-fixtures

      - name: Verify R08 functional phase acceptance
        run: python3 Scripts/r08_phase_acceptance.py --check

      - name: Verify R09 authorization and start contracts
        run: python3 Scripts/r09_contracts.py --all

      - name: Verify R09 functional phase acceptance
        run: python3 Scripts/r09_phase_acceptance.py --check

      - name: Verify R10 authorization and start contracts
        run: python3 Scripts/r10_contracts.py --all

      - name: Verify R11 authorization and start contracts
        run: python3 Scripts/r11_contracts.py --all

      - name: Verify R11 functional phase acceptance
        run: python3 Scripts/r11_phase_acceptance.py --check

      - name: Verify R12 generated functional acceptance
        run: python3 Scripts/r12_phase_acceptance.py --check-generated

      - name: Verify R12 functional phase acceptance
        run: python3 Scripts/r12_phase_acceptance.py --check

      - name: Verify R01 system assets remain untracked
        shell: bash
        run: |
          if git ls-files -- '.r01-local-assets' | grep -q .; then
            echo "R01 local system/model assets must never be tracked." >&2
            exit 1
          fi

      - name: Verify R01 capability aggregate when evidence is present
        shell: bash
        run: |
          evidence_present=false
          for evidence_path in \
            project-notes/evidence/r01/hosts/anchor-oldest-supported.json \
            project-notes/evidence/r01/hosts/anchor-m3-air.json \
            project-notes/evidence/r01/hosts/anchor-pro-max.json \
            project-notes/evidence/r01/hosts/anchor-core-ai.json \
            project-notes/apple-upscale-capabilities.json \
            project-notes/apple-upscale-capability-report.md; do
            if [ -e "$evidence_path" ] || [ -L "$evidence_path" ]; then
              evidence_present=true
            fi
          done
          if [ "$evidence_present" = true ]; then
            if [ -f project-notes/apple-upscale-capabilities.json ] && \
              grep -q '"evidence_kind": "operator_observation_waiver"' \
                project-notes/apple-upscale-capabilities.json; then
              python3 Scripts/r01_observation_waiver.py --check
            else
              python3 Scripts/r01_capabilities.py --check
            fi
          fi

      - name: Verify closed phase evidence
        shell: bash
        run: |
          while IFS= read -r manifest_path; do
            phase_id="$(basename "$(dirname "$manifest_path")" | tr '[:lower:]' '[:upper:]')"
            if [[ "$phase_id" == "R06" ]]; then
              ./Scripts/verify-r06-layered-evidence.sh
            else
              python3 Scripts/phase_evidence.py --phase "$phase_id" --check
            fi
          done < <(find docs/roadmaps/evidence -type f -name 'phase-evidence.json' -print | sort)

  r02-functional-acceptance:
    name: R02 functional acceptance
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact R02 source checkpoint
        run: git worktree add --detach /private/tmp/mirmir-r02-eeabc422-source eeabc4224100bc8ed86ae1208189bee508844210

      - name: Run exact R02 selected tests
        working-directory: /private/tmp/mirmir-r02-eeabc422-source
        run: xcodebuild -quiet -project Mirmir.xcodeproj -scheme Mirmir -configuration Debug -destination platform=macOS,arch=arm64 -derivedDataPath /private/tmp/mirmir-r02-eeabc422-v2-derived -resultBundlePath /private/tmp/mirmir-r02-eeabc422-v2.xcresult -disableAutomaticPackageResolution test -only-testing:MirmirTests/AppleUpscaleContractsTests -only-testing:MirmirTests/EnhancementPipelineContractsTests -only-testing:MirmirTests/AppleUpscaleFIFOSessionTests -only-testing:MirmirTests/R02FixtureConformanceTests -only-testing:MirmirTests/ArchitectureGuardrailTests/test_productionCompositionUsesNoRetainedReferenceBackendOrVTStager -only-testing:MirmirTests/UpscalerEngineAvailabilityTests/test_unavailableServiceRejectsSubmissionWithTypedReason CODE_SIGNING_ALLOWED=NO

      - name: Validate raw R02 xcresult
        if: ${{ always() }}
        run: python3 Scripts/r02_phase_acceptance.py --check-xcresult /private/tmp/mirmir-r02-eeabc422-v2.xcresult

      - name: Verify checked-in R02 acceptance
        if: ${{ always() }}
        run: python3 Scripts/r02_phase_acceptance.py --check

      - name: Upload raw R02 xcresult
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r02-functional-acceptance-xcresult
          path: /private/tmp/mirmir-r02-eeabc422-v2.xcresult
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  r04-functional-acceptance:
    name: R04 functional acceptance
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact R04 source checkpoint
        run: git worktree add --detach /private/tmp/mirmir-r04-ab77e978-source ab77e97867d51168e90c0190f6430d4acd769e68

      - name: Run exact R04 selected tests
        working-directory: /private/tmp/mirmir-r04-ab77e978-source
        run: xcodebuild -quiet -project Mirmir.xcodeproj -scheme Mirmir -configuration Debug -destination platform=macOS,arch=arm64 -derivedDataPath /private/tmp/mirmir-r04-ab77e978-derived -resultBundlePath /private/tmp/mirmir-r04-ab77e978.xcresult -disableAutomaticPackageResolution test -only-testing:MirmirTests/R04VideoToolboxContractsTests -only-testing:MirmirTests/R04VideoToolboxSessionAdapterTests -only-testing:MirmirTests/UpscalerEngineAvailabilityTests -only-testing:MirmirTests/R04FunctionalPhaseAcceptanceTests 'EXCLUDED_SOURCE_FILE_NAMES=*.metal' CODE_SIGNING_ALLOWED=NO

      - name: Validate raw R04 xcresult
        if: ${{ always() }}
        run: python3 Scripts/r04_phase_acceptance.py --check-xcresult /private/tmp/mirmir-r04-ab77e978.xcresult

      - name: Verify checked-in R04 acceptance
        if: ${{ always() }}
        run: python3 Scripts/r04_phase_acceptance.py --check

      - name: Upload raw R04 xcresult
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r04-functional-acceptance-xcresult
          path: /private/tmp/mirmir-r04-ab77e978.xcresult
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

