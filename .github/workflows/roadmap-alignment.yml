name: Roadmap alignment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-alignment-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  roadmap-alignment:
    name: Roadmap alignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test roadmap, inventory, and phase-evidence verifiers
        run: python3 -m unittest Scripts/tests/test_roadmap_alignment.py Scripts/tests/test_r00_inventory.py Scripts/tests/test_phase_evidence.py

      - name: Verify roadmap alignment
        run: python3 Scripts/roadmap_alignment.py --check

      - name: Verify R00 source inventory
        run: python3 Scripts/r00_inventory.py --check

      - name: Verify closed phase evidence
        shell: bash
        run: |
          while IFS= read -r manifest_path; do
            phase_id="$(basename "$(dirname "$manifest_path")" | tr '[:lower:]' '[:upper:]')"
            python3 Scripts/phase_evidence.py --phase "$phase_id" --check
          done < <(find docs/roadmaps/evidence -type f -name 'phase-evidence.json' -print | sort)
