        run: git worktree add --detach /private/tmp/mirmir-r06-6c4a6d3d-source 6c4a6d3d5f8a59c553b10c23783c148ccb3388a5

      - name: Run exact R06 selected tests
        working-directory: /private/tmp/mirmir-r06-6c4a6d3d-source
        run: xcodebuild -quiet -project Mirmir.xcodeproj -scheme Mirmir -configuration Debug -destination platform=macOS,arch=arm64 -derivedDataPath /private/tmp/mirmir-r06-6c4a6d3d-derived -resultBundlePath /private/tmp/mirmir-r06-6c4a6d3d.xcresult -disableAutomaticPackageResolution test -only-testing:MirmirTests/R06ASHDecisionContextTests -only-testing:MirmirTests/R06ASHMasksAndAblationsTests -only-testing:MirmirTests/R06ASHOrchestratorTests -only-testing:MirmirTests/R06ASHPolicyCatalogTests -only-testing:MirmirTests/R06FunctionalPhaseAcceptanceTests -only-testing:MirmirTests/R07FunctionalCoordinatorTests -only-testing:MirmirTests/R07FunctionalCoordinatorTransactionTests 'EXCLUDED_SOURCE_FILE_NAMES=*.metal' CODE_SIGNING_ALLOWED=NO

      - name: Validate raw R06 xcresult
        if: ${{ always() }}
        run: python3 Scripts/r06_phase_acceptance.py --check-xcresult /private/tmp/mirmir-r06-6c4a6d3d.xcresult

      - name: Verify checked-in R06 acceptance
        if: ${{ always() }}
        run: python3 Scripts/r06_phase_acceptance.py --check

      - name: Upload raw R06 xcresult
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r06-functional-acceptance-xcresult
          path: /private/tmp/mirmir-r06-6c4a6d3d.xcresult
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  r10-functional-acceptance:
    name: R10 functional acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact R10 source checkpoint
        run: git worktree add --detach /private/tmp/mirmir-r10-3a76c6a-source 3a76c6a03ea0f52f2a2395925badd5d5d1c03c6b

      - name: Verify exact R10 source identity
        working-directory: /private/tmp/mirmir-r10-3a76c6a-source
        run: |
          git rev-parse HEAD | grep -Fx 3a76c6a03ea0f52f2a2395925badd5d5d1c03c6b
          git rev-parse HEAD^{tree} | grep -Fx 37951da694ab4fbca6f8c663bb2883e5084b861c

      - name: Run exact R10 selected tests
        working-directory: /private/tmp/mirmir-r10-3a76c6a-source
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v validation.calibration_v2.tests.test_r10_optimizer validation.calibration_v2.tests.test_r10_persistence 2>&1 | tee /private/tmp/mirmir-r10-3a76c6a-unittest.log
          grep -c ' \.\.\. ok$' /private/tmp/mirmir-r10-3a76c6a-unittest.log | grep -Fx 39

      - name: Run exact R10 fixture calibration
        working-directory: /private/tmp/mirmir-r10-3a76c6a-source
        run: PYTHONDONTWRITEBYTECODE=1 python3 validation/calibration_v2/tools/run_r10_fixture_calibration.py --source-commit 3a76c6a03ea0f52f2a2395925badd5d5d1c03c6b --output-root /private/tmp/mirmir-r10-3a76c6a-calibration-run

      - name: Compare exact R10 fixture calibration closure
        run: |
          test -d /private/tmp/mirmir-r10-3a76c6a-calibration-run/terminals
          test -z "$(find /private/tmp/mirmir-r10-3a76c6a-calibration-run/terminals -mindepth 1 -print -quit)"
          cmp /private/tmp/mirmir-r10-3a76c6a-calibration-run/run-receipt.json docs/roadmaps/evidence/r10/records/artifacts/functional-phase-acceptance/calibration-run/run-receipt.json
          diff --recursive --no-dereference /private/tmp/mirmir-r10-3a76c6a-calibration-run/checkpoints docs/roadmaps/evidence/r10/records/artifacts/functional-phase-acceptance/calibration-run/checkpoints
          diff --recursive --no-dereference /private/tmp/mirmir-r10-3a76c6a-calibration-run/frozen-policies docs/roadmaps/evidence/r10/records/artifacts/functional-phase-acceptance/calibration-run/frozen-policies

      - name: Validate generated R10 acceptance evidence
        run: python3 Scripts/r10_phase_acceptance.py --check-generated

      - name: Verify checked-in R10 acceptance
        run: python3 Scripts/r10_phase_acceptance.py --check

      - name: Verify deep R10 contracts
        run: python3 Scripts/r10_contracts.py --all

  r11-functional-acceptance:
    name: R11 functional acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact R11 source checkpoint
        run: git worktree add --detach /private/tmp/mirmir-r11-75479b9-source 75479b9f30511330f2a18b656151dc551292cb1e

      - name: Verify exact R11 source identity
        working-directory: /private/tmp/mirmir-r11-75479b9-source
        run: |
          git rev-parse HEAD | grep -Fx 75479b9f30511330f2a18b656151dc551292cb1e
          git rev-parse HEAD^{tree} | grep -Fx 0dd42ec30b212456223ee582b549de30a0e3416f

      - name: Run exact R11 selected tests
        working-directory: /private/tmp/mirmir-r11-75479b9-source
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v validation.calibration_v2.tests.test_r11_traceability validation.calibration_v2.tests.test_run_r11_fixture_traceability Scripts.tests.test_r11_contracts 2>&1 | tee /private/tmp/mirmir-r11-75479b9-unittest.log
          grep -c ' \.\.\. ok$' /private/tmp/mirmir-r11-75479b9-unittest.log | grep -Fx 76

      - name: Run exact R11 traceability fixture
        working-directory: /private/tmp/mirmir-r11-75479b9-source
        run: PYTHONDONTWRITEBYTECODE=1 python3 validation/calibration_v2/tools/run_r11_fixture_traceability.py --source-commit 75479b9f30511330f2a18b656151dc551292cb1e --output-root /private/tmp/mirmir-r11-75479b9-traceability-run

      - name: Compare exact R11 traceability closure
        run: |
          cmp /private/tmp/mirmir-r11-75479b9-traceability-run/traceability-run-receipt.json docs/roadmaps/evidence/r11/records/traceability-run-receipt.json
          cmp /private/tmp/mirmir-r11-75479b9-traceability-run/traceability-run-receipt.json docs/roadmaps/evidence/r11/records/artifacts/functional-phase-acceptance/traceability-run-receipt.json

      - name: Validate generated R11 acceptance evidence
        run: python3 Scripts/r11_phase_acceptance.py --check-generated

      - name: Verify checked-in R11 acceptance
        run: python3 Scripts/r11_phase_acceptance.py --check

      - name: Verify deep R11 contracts
        run: python3 Scripts/r11_contracts.py --all

  r12-functional-acceptance:
    name: R12 functional acceptance
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact R12 source checkpoint
        run: git worktree add --detach /private/tmp/mirmir-r12-2f5e298-source 2f5e2987fe6a0e88d39790f177c717b62d29d6e4

      - name: Verify exact R12 source identity
        working-directory: /private/tmp/mirmir-r12-2f5e298-source
        run: |
          git rev-parse HEAD | grep -Fx 2f5e2987fe6a0e88d39790f177c717b62d29d6e4
          git rev-parse HEAD^{tree} | grep -Fx 4971b4d38f92ea5edffe925e507f058e9ffc13d8

      - name: Verify R12 evidence checkpoint ancestry
        run: git merge-base --is-ancestor 3f31f7aa5bfc9e01eb1124f0f9db7b8ea6e17ff6 HEAD

      - name: Build exact R12 selected-test product
        working-directory: /private/tmp/mirmir-r12-2f5e298-source
        run: xcodebuild build-for-testing -project Mirmir.xcodeproj -scheme Mirmir -configuration Debug -destination platform=macOS,arch=arm64 -derivedDataPath /private/tmp/mirmir-r12-2f5e298-derived -disableAutomaticPackageResolution R12_ACCEPTANCE_SOURCE_COMMIT=2f5e2987fe6a0e88d39790f177c717b62d29d6e4 R12_ACCEPTANCE_SOURCE_TREE=4971b4d38f92ea5edffe925e507f058e9ffc13d8 'EXCLUDED_SOURCE_FILE_NAMES=*.metal'

      - name: Run exact R12 selected tests
        working-directory: /private/tmp/mirmir-r12-2f5e298-source
        shell: bash
        run: |
          test "$(find /private/tmp/mirmir-r12-2f5e298-derived/Build/Products -type f -name '*.xctestrun' | wc -l | tr -d ' ')" = 1
          r12_xctestrun="$(find /private/tmp/mirmir-r12-2f5e298-derived/Build/Products -type f -name '*.xctestrun' -print -quit)"
          xcodebuild test-without-building -xctestrun "$r12_xctestrun" -destination platform=macOS,arch=arm64 -only-testing:MirmirTests/R12MediaFormatContractV2Tests -only-testing:MirmirTests/R12RouteAndHardwareResolverTests -only-testing:MirmirTests/R12ChunkCheckpointLedgerTests R12_ACCEPTANCE_SOURCE_COMMIT=2f5e2987fe6a0e88d39790f177c717b62d29d6e4 R12_ACCEPTANCE_SOURCE_TREE=4971b4d38f92ea5edffe925e507f058e9ffc13d8

      - name: Validate generated R12 acceptance evidence
        run: |
          echo "67a175f14ab43688022ca72f84b956cd7081ed1972e3fb52bf9cef57af831080  docs/roadmaps/evidence/r12/records/functional-phase-acceptance.json" | shasum -a 256 -c -
          echo "09c6e370dcba37e39141477b254005a40aedc9e79a9d9e83c7667b7b7bf1af27  docs/roadmaps/evidence/r12/records/functional-execution-receipt.json" | shasum -a 256 -c -
          python3 Scripts/r12_phase_acceptance.py --check-generated

      - name: Verify checked-in R12 acceptance
        run: python3 Scripts/r12_phase_acceptance.py --check
