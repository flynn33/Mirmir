      - name: Materialize exact R05 source checkpoint
        run: git worktree add --detach /private/tmp/mirmir-r05-7e1ab673-source 7e1ab67340e4d6d95a3d92e8a48bc6cd356005b8

      - name: Run exact R05 selected tests
        working-directory: /private/tmp/mirmir-r05-7e1ab673-source
        run: xcodebuild -quiet -project Mirmir.xcodeproj -scheme Mirmir -configuration Debug -destination platform=macOS,arch=arm64 -derivedDataPath /private/tmp/mirmir-r05-7e1ab673-derived -resultBundlePath /private/tmp/mirmir-r05-7e1ab673.xcresult -disableAutomaticPackageResolution test -only-testing:MirmirTests/R05MetalFXContractsTests -only-testing:MirmirTests/R05MetalFXColorBridgeTests -only-testing:MirmirTests/R05MetalFXSpatialDriverTests -only-testing:MirmirTests/R05MetalFXSpatialBackendTests -only-testing:MirmirTests/R05FunctionalPhaseAcceptanceTests 'EXCLUDED_SOURCE_FILE_NAMES=*.metal' CODE_SIGNING_ALLOWED=NO

      - name: Validate raw R05 xcresult
        if: ${{ always() }}
        run: python3 Scripts/r05_phase_acceptance.py --check-xcresult /private/tmp/mirmir-r05-7e1ab673.xcresult

      - name: Verify checked-in R05 acceptance
        if: ${{ always() }}
        run: python3 Scripts/r05_phase_acceptance.py --check

      - name: Upload raw R05 xcresult
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r05-functional-acceptance-xcresult
          path: /private/tmp/mirmir-r05-7e1ab673.xcresult
          if-no-files-found: warn
