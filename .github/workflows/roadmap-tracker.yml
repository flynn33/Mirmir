name: Verify roadmap tracker

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-roadmap-tracker:
    name: Verify live roadmap status
    # Raw simulator-metric replay is architecture-sensitive at percentile tie
    # boundaries, so use the same macOS/ARM64 runner family as M7 qualification.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install locked Python test runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install simulator-metric dependency
        run: python3 -m pip install 'numpy==2.0.2'

      - name: Test tracker and selection contracts
        run: |
          python3 script/v4/test_update_roadmap_tracker.py
          python3 script/v4/test_derive_m7_quality_contract_v4.py
          python3 script/v4/test_select_simulated_candidate_v4.py

      - name: Verify committed tracker is current
        run: python3 script/v4/update_roadmap_tracker.py --check
