name: Mirmir
options:
  bundleIdPrefix: com.mirmir
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

packages:
  ForsettiFramework:
    url: https://github.com/flynn33/Forsetti-Framework-Mac-iOS.git
    revision: 43eef7a739f3b78253c64aa4b070521ab5b1f43c

targets:
  Mirmir:
    type: application
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: Mirmir
        excludes:
          - "**/*.md"
    resources:
      - path: Mirmir/Assets.xcassets
      - path: Mirmir/Resources/ForsettiManifests
        type: folder
      - path: Mirmir/Resources/ASH
        type: folder
    dependencies:
      - package: ForsettiFramework
        product: ForsettiCore
      - package: ForsettiFramework
        product: ForsettiPlatform
      - package: ForsettiFramework
        product: ForsettiHostTemplate
    info:
      path: Mirmir/Info.plist
      properties:
        CFBundleName: Mirmir
        CFBundleDisplayName: Mirmir
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.4"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirmir.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Mirmir/Mirmir.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video

  MirmirTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: MirmirTests
    dependencies:
      - target: Mirmir
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mirmir.app/Contents/MacOS/Mirmir"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mirmir.app.tests
