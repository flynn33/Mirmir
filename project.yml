name: Mirmir
options:
  bundleIdPrefix: com.mirmir
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Mirmir:
    type: application
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: Mirmir
        excludes:
          - "**/*.md"
    resources:
      - path: Mirmir/Assets.xcassets
      - path: Mirmir/Resources/ASH
        type: folder
      - path: Mirmir/Resources/Legal
        type: folder
    info:
      path: Mirmir/Info.plist
      properties:
        CFBundleName: Mirmir
        CFBundleDisplayName: Mirmir
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "15.4"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirmir.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Mirmir/Mirmir.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  R01CapabilityWorker:
    type: tool
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: R01CapabilityWorker
      - path: Mirmir/Modules/UpscalerEngine
        includes:
          - "AppleUpscaleCapability*.swift"
    settings:
      base:
        PRODUCT_NAME: R01CapabilityWorker
        CODE_SIGNING_ALLOWED: NO

  MirmirTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.4"
    info:
      path: MirmirTests/Info.plist
      properties:
        R03QualificationSourceCommit: "$(R03_QUALIFICATION_BUILD_SOURCE_COMMIT)"
        R03QualificationSourceTree: "$(R03_QUALIFICATION_BUILD_SOURCE_TREE)"
    sources:
      - path: MirmirTests
        excludes:
          - PerformanceTools
      - path: validation/calibration_v2/native_adapter/ASHCalibrationCLISupport.swift
      - path: validation/calibration_v2/native_adapter/ASHCalibrationCLIProtocol.swift
    dependencies:
      - target: Mirmir
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mirmir.app/Contents/MacOS/Mirmir"
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.mirmir.app.tests

  MirmirP08Tests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: MirmirP08Tests
    settings:
      base:
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mirmir.app.p08-tests

schemes:
  Mirmir:
    build:
      targets:
        Mirmir: all
        MirmirTests: [test, analyze]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MirmirTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Mirmir P08:
    build:
      targets:
        MirmirP08Tests: [test, analyze]
    test:
      config: Release
      targets:
        - name: MirmirP08Tests
          parallelizable: false
      environmentVariables:
        MTL_CAPTURE_ENABLED: "1"
    analyze:
      config: Release
